<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bitly — сокращатель ссылок</title>
  <meta name="theme-color" content="#08090f">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>
    // Применяем тему до отрисовки, чтобы не было вспышки
    document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="grid"></div>
  </div>

  <header class="topbar">
    <a href="/" class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
      </span>
      <span>bitly</span>
    </a>
    <nav>
      <a href="/docs" class="nav-link" target="_blank">API</a>
      <button id="theme" class="icon-btn" type="button" title="Сменить тему" aria-label="Сменить тему">
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <span class="pill"><span class="dot"></span> Self-hosted · без трекинга · open source</span>
      <h1>Длинные ссылки —<br><span class="grad">в короткие</span></h1>
      <p class="lead">Вставьте адрес, получите аккуратную короткую ссылку и следите за переходами.</p>
    </section>

    <form id="form" class="card glass shorten" autocomplete="off">
      <div class="field big">
        <svg class="field-icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
        <input id="url" type="text" inputmode="url" placeholder="https://очень-длинная-ссылка.com/..." required autofocus>
        <button id="submit" class="btn primary" type="submit">
          <span class="btn-label">Сократить</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="options">
        <button id="toggle-alias" type="button" class="link-btn">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Свой адрес
        </button>
      </div>

      <div id="alias-row" class="field prefix hidden">
        <span id="alias-prefix" class="prefix-text"></span>
        <input id="alias" type="text" placeholder="my-link" maxlength="32">
      </div>

      <div id="key-row" class="field hidden">
        <svg class="field-icon" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M16 7l3 3M18 5l2 2"/></svg>
        <input id="api-key" type="password" placeholder="API-ключ (задан на сервере)">
      </div>

      <p id="error" class="error hidden"></p>
    </form>

    <section id="result" class="card glass result hidden" aria-live="polite">
      <div class="result-head">
        <span class="check"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span>Готово! Ваша короткая ссылка</span>
      </div>
      <div class="result-body">
        <a id="short" class="short-link" href="#" target="_blank" rel="noopener"></a>
        <div class="result-actions">
          <button id="copy" class="btn primary" type="button">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            <span>Копировать</span>
          </button>
          <a id="open" class="btn ghost" href="#" target="_blank" rel="noopener" title="Открыть">
            <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          </a>
        </div>
      </div>
      <p id="original" class="original"></p>
    </section>

    <section class="stats">
      <div class="stat glass">
        <span class="stat-label">Ссылок</span>
        <span id="stat-links" class="stat-value">—</span>
      </div>
      <div class="stat glass">
        <span class="stat-label">Переходов</span>
        <span id="stat-clicks" class="stat-value">—</span>
      </div>
    </section>

    <section class="card glass list">
      <div class="list-head">
        <h2>Ваши ссылки</h2>
        <div class="field small">
          <svg class="field-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Поиск…">
        </div>
      </div>
      <ul id="links" class="links"></ul>
      <div id="empty" class="empty hidden">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
        <p id="empty-text">Здесь появятся ваши ссылки</p>
      </div>
    </section>
  </main>

  <footer>
    <span>bitly · свой сокращатель ссылок</span>
    <a href="https://github.com/dzmitry-murauyou/bitly" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
